name: Release

# Push a tag like v0.2.0 to build, notarize, and publish capy-companion for macOS.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-26
    environment:
      name: release
    permissions:
      contents: write
    env:
      CAPY_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      CAPY_UPDATE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      CAPY_NOTARY_PROFILE: capy-notary
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Validate release version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "Tag must be v<major>.<minor>[.<patch>]: $GITHUB_REF_NAME" >&2
            exit 1
          }
          printf 'CAPY_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/capy-signing.keychain-db"
          printf 'KEYCHAIN_PATH=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATES_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || {
            echo "No Developer ID Application identity in MACOS_CERTIFICATE_P12_BASE64" >&2
            exit 1
          }

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/capy-companion.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          printf 'CAPY_MAC_PROFILE=%s\n' "$profile" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$CAPY_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, and notarize
        run: bash Scripts/release.sh mac

      - name: Generate signed update feed
        if: ${{ vars.SPARKLE_PUBLIC_KEY != '' }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash Scripts/appcast.sh --version "$CAPY_VERSION" --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          assets=(capy-companion.dmg "capy-companion-$CAPY_VERSION.zip")
          [[ -f appcast.xml ]] && assets+=(appcast.xml)
          shasum -a 256 capy-companion.dmg "capy-companion-$CAPY_VERSION.zip" > SHA256SUMS
          assets+=(SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "capy-companion $CAPY_VERSION" --generate-notes "${assets[@]}"
          fi

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/capy-companion.provisionprofile"
