name: CapyCompanion
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.2
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CAPY_MAC_BUNDLE_ID: com.capyinput.companion
    CAPY_BUNDLE_ID_SUFFIX: ""
    CAPY_APP_ICON_NAME: AppIcon
    CAPY_APP_GROUP: group.com.capyinput.keyboard
    CAPY_ICLOUD_CONTAINER: iCloud.com.capyinput.keyboard
    CAPY_SYNC_SERVER: ""
    CAPY_ENABLE_SERVER_SYNC: "0"
    CAPY_UPDATE_FEED_URL: ""
    CAPY_UPDATE_PUBLIC_KEY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ICLOUD_ENVIRONMENT: Development
      CAPY_ENABLE_SERVER_SYNC: "1"
      CAPY_BUNDLE_ID_SUFFIX: ".debug"
      CAPY_APP_ICON_NAME: AppIconDebug
    Release:
      ICLOUD_ENVIRONMENT: Production
      CAPY_ENABLE_SERVER_SYNC: "0"
      CAPY_BUNDLE_ID_SUFFIX: ""
      CAPY_APP_ICON_NAME: AppIcon
targets:
  CapyCompanion:
    type: application
    platform: macOS
    productName: capy-companion
    preBuildScripts:
      - name: Validate localizations
        script: /usr/bin/python3 "$SRCROOT/Scripts/localization.py" --catalog-only
        inputFiles:
          - "$(SRCROOT)/Scripts/localization.py"
          - "$(SRCROOT)/Apple/Localization/Localizable.xcstrings"
          - "$(SRCROOT)/Apple/Localization/L10n.swift"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Yams
      - package: Sparkle
      - framework: Vendor/librime-dynamic.xcframework
        embed: true
    sources:
      - Apple/Localization
      - Apple/Mac
      - Apple/Bridge
      - Apple/Shared/AppError.swift
      - Apple/Shared/SyncClient.swift
      - Apple/Shared/SharedSettings.swift
      - Apple/Shared/RimeSchema.swift
      - Apple/Shared/RimeLibrary.swift
      - Apple/Shared/LearnedDictionary.swift
      - Apple/Shared/LibraryArchive.swift
      - Apple/Shared/LibraryCloud.swift
      - Apple/Shared/LearnedSync.swift
      - path: Apple/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/Rime/Licenses
        type: folder
        buildPhase: resources
      - path: Resources/ScreenWords
        type: folder
        buildPhase: resources
      - path: Resources/AutoSwitch
        type: folder
        buildPhase: resources
    info:
      path: Apple/Mac/Info.plist
      properties:
        CFBundleDisplayName: capy-companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "$(CAPY_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(CAPY_UPDATE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CapyAppGroup: "$(CAPY_APP_GROUP)"
        CapyICloudContainer: "$(CAPY_ICLOUD_CONTAINER)"
        CapySyncServerURL: "$(CAPY_SYNC_SERVER)"
        CapyEnableServerSync: "$(CAPY_ENABLE_SERVER_SYNC)"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSScreenCaptureUsageDescription: capy-companion reads visible text to suggest words while you type.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.capyinput.library
            UTTypeDescription: Rime Library
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rimelibrary]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: "$(CAPY_MAC_BUNDLE_ID)$(CAPY_BUNDLE_ID_SUFFIX)"
      PRODUCT_NAME: capy-companion
      ASSETCATALOG_COMPILER_APPICON_NAME: "$(CAPY_APP_ICON_NAME)"
      SWIFT_OBJC_BRIDGING_HEADER: Apple/Bridge/RimeEngine.h
      CODE_SIGN_ENTITLEMENTS: Apple/Mac/Sync.entitlements
      ENABLE_HARDENED_RUNTIME: YES
schemes:
  CapyCompanion:
    build:
      targets: {CapyCompanion: all}
